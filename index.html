<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Tools Directory</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
  <div class="max-w-6xl mx-auto px-4 py-10">
    <header class="text-center mb-10">
      <h1 class="text-4xl font-bold tracking-tight mb-2">Каталог AI Инструментов</h1>
      <p class="text-slate-400">Подборка лучших нейросетей и сервисов</p>
    </header>

    <!-- Поиск и фильтры -->
    <div class="flex flex-col sm:flex-row gap-4 mb-8">
      <input 
        type="text" 
        id="searchInput" 
        placeholder="Поиск по названию или описанию..." 
        class="w-full sm:w-2/3 bg-slate-800 border border-slate-700 rounded-lg px-4 py-2.5 focus:outline-none focus:border-indigo-500 text-sm"
      >
      <select 
        id="categoryFilter" 
        class="w-full sm:w-1/3 bg-slate-800 border border-slate-700 rounded-lg px-4 py-2.5 focus:outline-none focus:border-indigo-500 text-sm"
      >
        <option value="all">Все категории</option>
        <option value="text">Текст & Код</option>
        <option value="image">Изображения & Видео</option>
        <option value="audio">Аудио & Голос</option>
        <option value="productivity">Продуктивность</option>
      </select>
    </div>

    <!-- Контейнер карточек -->
    <div id="toolsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
